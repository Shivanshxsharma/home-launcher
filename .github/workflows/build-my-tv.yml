# Builds MY TV on GitHub's machines, so no Android SDK is needed on the PC.
name: Build MY TV

on:
  push:
    branches: [my-tv]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" > /dev/null
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :mytv:assembleRelease -PpublicBuild --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: my-tv-apk
          path: mytv/build/outputs/apk/release/*.apk
          retention-days: 7
